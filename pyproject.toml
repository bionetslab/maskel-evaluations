[project]
name = "maskel-evaluations"
version = "0.1.0"
description = "Benchmarks and analysis notebooks for maskel"
requires-python = ">=3.13"
dependencies = [
    "maskel>=1.1.3,<2",
    "itk>=5.4.6",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "scipy>=1.17.1",
    "skan>=0.13.1",
    "scikit-image>=0.26.0",
    "tifffile",
    "nibabel>=5.0.0",  # VesselVio's library/lee94.py imports this at module level
]

[project.optional-dependencies]
notebooks = [
    "pandas",
    "matplotlib",
    "seaborn>=0.13.2",
    "scikit-learn>=1.8.0",
    "jupyterlab",
]

[tool.uv]
package = false
